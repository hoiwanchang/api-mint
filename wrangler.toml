name = "api-mint"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 自定义子域名 route：api.aipps.vip/*（aipps.vip zone 已托管在 CF）
routes = [
  { pattern = "api.aipps.vip/*", zone_name = "aipps.vip" }
]

[vars]
UPTIME = "2026-08-30"

# 限流已改内存计数；PV 计数已迁 Durable Object → 本 worker 零 KV。

# --- PV counter: Durable Object (zero KV; separate 100k-ops/mo quota) ---
[durable_objects]
bindings = [{ name = "PV", class_name = "PVCounter" }]

[exports.PVCounter]
type = "durable-object"
storage = "sqlite"

# Cron: daily self-check at 09:00 UTC (17:00 CST).
[triggers]
crons = ["0 9 * * *"]

# [observability]
# logs = { enabled = true }

# NOTE: Cache API is available to Workers without extra config on all plans.
# API_KEYS (comma-separated paid keys) set as a secret/env var in the dashboard
# or via `wrangler secret put API_KEYS`.
